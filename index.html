        body {

            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
            position: relative;
        }

        /* Meteor Effect */
        #meteor-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            pointer-events: none;
            z-index: 0;
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }

        .main-content {
            width: 100%;
            max-width: 420px;
            z-index: 1;
            position: relative;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 35px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--color-1);
            object-fit: cover;
        }

        .name-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--color-1);
        }

        .verified-tick {
            width: 18px;
            height: 18px;
            fill: #1d9bf0;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 40px;
        }

        .link-card {
            background-color: var(--color-3);
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--color-2);
            position: relative;
            height: 50px;
            box-sizing: border-box;
        }

        .link-card:hover { 
            transform: scale(1.02); 
            background-color: var(--color-2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .full-link { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; border-radius: 50px; }

        .icon-box { 
            width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center; 
            z-index: 2; 
        }

        .link-card svg { width: 20px; height: 20px; fill: white; }

        .link-text { 
            font-weight: 500; 
            flex-grow: 1; 
            text-align: center; 
            z-index: 1; 
            pointer-events: none; 
            font-size: 0.95rem;
        }

        .copy-btn { 
            background: none; border: none; cursor: pointer; 
            padding: 5px; display: flex; align-items: center; 
            z-index: 10; margin-left: auto;
        }

        .copy-btn svg { fill: var(--color-1); width: 18px; height: 18px; }

        .system-footer {
            width: 100%;
            background-color: #051614;
            border-top: 1px solid var(--color-2);
            border-radius: 40px 40px 0 0;
            padding: 45px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 1;
            box-sizing: border-box;
        }

        .badge-grid {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        .badge-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0.6;
            transition: 0.3s;
        }

        .badge-box:hover { opacity: 1; }

        .badge-box svg { width: 32px; height: 32px; }

        .badge-tag { font-size: 0.5rem; font-weight: 900; text-transform: uppercase; color: var(--color-1); letter-spacing: 1px; }

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => { alert('Copied: ' + text); });
        }

        const canvas = document.getElementById('meteor-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();
        const meteors = [];
        class Meteor {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * (canvas.width + 200);
                this.y = Math.random() * -100;
                this.size = Math.random() * 0.8 + 0.2; 
                this.speed = Math.random() * 2 + 1; 
                this.length = Math.random() * 40 + 10;
                this.opacity = Math.random() * 0.2 + 0.1;
            }
            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(64, 109, 97, ${this.opacity})`;
                ctx.lineWidth = this.size;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.length, this.y + this.length);
                ctx.stroke();
            }
            update() {
                this.x -= this.speed; this.y += this.speed;
                if (this.y > canvas.height * 0.5 || this.x < -50) { this.reset(); }
            }
        }
        for (let i = 0; i < 30; i++) { meteors.push(new Meteor()); }
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            meteors.forEach(m => { m.draw(); m.update(); });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
