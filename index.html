        :root {

            --color-3: #133129;
            --color-4: #081F1C;
            --bg-color: #021010;
            --accent: #f1c232;

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas hiệu ứng */
        #meteor-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50%;
            pointer-events: none;
            z-index: 0;
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        }

        .container {
            width: 100%;
            max-width: 450px;
            z-index: 1;
            position: relative;
        }

        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-bottom: 40px;
            padding: 10px;
            text-align: center;
        }

        /* Fix viền avatar cùng màu tên */
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--color-1);
            object-fit: cover;
        }

        /* Container cho tên và tick xanh */
        .name-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .user-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--color-1);
        }

        /* Style cho tick xanh */
        .verified-tick {
            width: 20px;
            height: 20px;
            fill: #1d9bf0; /* Màu xanh đặc trưng của tick verified */
            flex-shrink: 0;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-card {
            background-color: var(--color-3);
            display: flex;
            align-items: center;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            color: white;
            transition: all 0.2s ease;
            border: 1px solid var(--color-2);
            position: relative;
        }

        .link-card:hover {
            transform: translateY(-2px);
            background-color: var(--color-2);
        }

        .full-link {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            border-radius: 50px;
        }

        .icon-box {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 2;
        }

        .link-card svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .link-text {
            font-weight: 500;
            flex-grow: 1;
            text-align: center;
            position: absolute;
            left: 0;
            right: 0;
            z-index: 1;
            pointer-events: none;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            margin-left: auto;
            position: relative;
            z-index: 10;
        }

        .copy-btn svg {
            fill: var(--color-1);
            width: 18px;
            height: 18px;
            transition: fill 0.3s;
        }

        .copy-btn:hover svg {
            fill: var(--accent);
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px;
            font-size: 0.8rem;
            color: #444;
            text-align: center;
            z-index: 1;

    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied: ' + text);
            });
        }

        const canvas = document.getElementById('meteor-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const meteors = [];

        class Meteor {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * (canvas.width + 200);
                this.y = Math.random() * -100;
                this.size = Math.random() * 0.8 + 0.2; 
                this.speed = Math.random() * 2 + 1; 
                this.length = Math.random() * 40 + 10;
                this.opacity = Math.random() * 0.3 + 0.1;
            }

            draw() {
                ctx.beginPath();
                ctx.strokeStyle = `rgba(64, 109, 97, ${this.opacity})`;
                ctx.lineWidth = this.size;
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - this.length, this.y + this.length);
                ctx.stroke();
            }

            update() {
                this.x -= this.speed;
                this.y += this.speed;

                if (this.y > canvas.height * 0.5 || this.x < -50) {
                    this.reset();
                }
            }
        }

        for (let i = 0; i < 40; i++) {
            meteors.push(new Meteor());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            meteors.forEach(m => {
                m.draw();
                m.update();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
